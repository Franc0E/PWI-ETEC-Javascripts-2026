<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
      var um = 1
      var n1 = parseInt(prompt("Digite um número positivo (deve ser positivo)"));
    if (n1 < 0) alert("Número negativo")
else for (cont = 1; cont <= n1; cont++){
alert(um += cont);
}

    </script>
</body>
</html>
