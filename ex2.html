<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
var n1 = parseInt(prompt("Digite um número"));
var n2 = parseInt(prompt("Digite um outro número"));
var n3 = parseInt(prompt("Digite um terceiro número"));

if(n1 > n2 && n1 > n3) alert("Dos três números, "+ n1 +" é o maior.")
if(n2 > n1 && n2 > n3) alert("Dos três números, "+ n2 +" é o maior.")
if(n3 > n1 && n3 > n2) alert("Dos três números, "+ n3 +" é o maior.")
if(n1 == n2 && n2 == n3) alert("Os três números inseridos são iguais, aprenda a digitar números diferentes.")

    </script>
</body>
</html>
