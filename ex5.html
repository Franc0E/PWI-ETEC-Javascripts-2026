<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
       var n1 = parseInt(prompt("Digite um número"));
       if(n1 == 1  || n1 == 2 || n1 == 3 || n1 == 5   ) alert("Número primo detectado");
            else if (n1 % 2 != 0 && n1 % 3 != 0 && n1 % 5 != 0) alert("Número primo detectado");
            else alert("Número não primo")  
    </script>
</body>
</html>
